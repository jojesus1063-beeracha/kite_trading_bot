name: Apply stewardship main wiring

on:
  push:
    branches:
      - stewardship-risk-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stewardship-risk-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply assertion-backed patch
        run: python apply_stewardship_main_patch.py
      - name: Commit main.py only when changed
        run: |
          if git diff --quiet -- main.py; then
            echo "No main.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- main.py
          git commit -m "main: finish stewardship audit wiring"
          git push origin HEAD:stewardship-risk-hardening
