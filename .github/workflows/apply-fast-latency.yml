name: Apply fast latency wiring

on:
  push:
    branches:
      - stewardship-risk-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stewardship-risk-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate patch anchors
        run: python apply_fast_latency_patch.py --check
      - name: Apply narrow latency patch
        run: python apply_fast_latency_patch.py
      - name: Commit patched live files when changed
        run: |
          if git diff --quiet -- config.py main.py; then
            echo "No config.py/main.py changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- config.py main.py
          git commit -m "live: wire fast adverse exit and lower scan latency"
          git push origin HEAD:stewardship-risk-hardening
