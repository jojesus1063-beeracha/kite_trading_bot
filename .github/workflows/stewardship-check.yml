name: Stewardship risk checks

on:
  push:
    branches:
      - stewardship-risk-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  stewardship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytest
      - name: Compile changed Python modules
        run: |
          python -m py_compile main.py config.py risk_manager.py strategy.py stewardship_policy.py apply_stewardship_main_patch.py apply_fast_latency_patch.py apply_fast_monitor_cap.py
      - name: Validate stewardship patch anchors
        run: python apply_stewardship_main_patch.py --check
      - name: Validate fast-latency patch anchors
        run: python apply_fast_latency_patch.py --check
      - name: Verify monitor cadence patch is idempotent
        run: |
          cp main.py /tmp/main.before.py
          python apply_fast_monitor_cap.py
          diff -u /tmp/main.before.py main.py
      - name: Run stewardship policy tests
        run: pytest -q test_stewardship_policy.py test_strategy_engulfing_gate.py
